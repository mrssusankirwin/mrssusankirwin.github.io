<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#0E4A47;color:#FFFFFF;font-family:'Jost',sans-serif;overflow-x:hidden}
  a{text-decoration:none;color:#FFFFFF}
  a:hover{color:rgba(255,255,255,0.7)}
  ::selection{background:#FFFFFF;color:#0E4A47}
  @media (max-width:700px){html{font-size:19px}}
  .piece-item{grid-column:span 3}
  @media (max-width:1000px){.piece-item{grid-column:span 4 !important}}
  @media (max-width:760px){.piece-item{grid-column:span 6 !important}}
</style>
</helmet>
<dc-import name="Nav" current="gallery" hint-size="100%,150px"></dc-import>

<section style="padding:58px 5vw 34px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px">
  <span style="font-family:'Jost',sans-serif;font-size:0.7rem;letter-spacing:0.24em;text-transform:uppercase;color:rgba(255,255,255,0.6)">Selected Works</span>
  <h1 style="font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2rem,4.6vw,3.2rem);letter-spacing:0.06em;margin:0">Gallery</h1>
  <p style="font-family:'Jost',sans-serif;font-weight:300;max-width:62ch;font-size:1rem;line-height:1.8;margin:0;color:rgba(255,255,255,0.8)">These are some of the paintings I have created over the years. If you're interested in a particular painting, please get in touch or see <a href="Commissions.dc.html" style="border-bottom:1px solid rgba(255,255,255,0.5)"><b>Commissions</b></a> for a piece made just for you.</p>
</section>

<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:14px 5vw 34px">
  <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
    <button onClick="{{ f.onClick }}" style="{{ f.style }}">{{ f.label }}</button>
  </sc-for>
</div>

<div style="padding:0 5vw 40px;display:grid;grid-template-columns:repeat(12,1fr);gap:34px">
  <sc-for list="{{ works }}" as="w" hint-placeholder-count="8">
    <div class="piece-item" style="{{ w.wrapStyle }}" onClick="{{ w.onClick }}">
      <div style="aspect-ratio:4/5;overflow:hidden;background:#0A3A38">
        <img src="{{ w.img }}" alt="{{ w.title }}" style="{{ w.imgStyle }}" style-hover="transform:scale(1.05)" loading="lazy">
      </div>
      <div style="margin-top:14px;text-align:center">
        <span style="font-family:'Cormorant Garamond',serif;font-size:1.1rem">{{ w.title }}</span>
      </div>
    </div>
  </sc-for>
</div>

<div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 5vw 56px">
  <span style="font-family:'Jost',sans-serif;font-size:0.68rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.55)">{{ countLabel }}</span>
  <div style="display:flex;gap:14px">
    <sc-if value="{{ hasPrevPage }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ prevPage }}" style="{{ pageBtnStyle }}" style-hover="background:#FFFFFF;color:#0E4A47">← Previous</button>
    </sc-if>
    <sc-if value="{{ hasNextPage }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ nextPage }}" style="{{ pageBtnStyle }}" style-hover="background:#FFFFFF;color:#0E4A47">Next →</button>
    </sc-if>
  </div>
</div>

<dc-import name="Quote" quote="When our little dog passed away at almost 19 years, we were devastated. While we had tons of photos we wanted something special to remember him by. We commissioned Susan to do a portrait of him from a photo and we were so happy at how well she captured his expression that we subsequently asked her to do portraits of our current two dogs. We are delighted with our 3 gorgeous portraits." attribution="Caroline" hint-size="100%,360px"></dc-import>

<dc-import name="Footer" hint-size="100%,420px"></dc-import>

<sc-if value="{{ lightboxOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;background:rgba(10,58,56,0.96);display:flex;align-items:center;justify-content:center;z-index:200;padding:5vw;touch-action:pan-y" onClick="{{ closeLightboxBg }}" onTouchStart="{{ onTouchStart }}" onTouchEnd="{{ onTouchEnd }}">
    <button onClick="{{ closeLightbox }}" style="position:absolute;top:30px;right:5vw;color:#FFFFFF;font-family:'Jost',sans-serif;font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;background:none;border:none;cursor:pointer">Close ✕</button>
    <button onClick="{{ showPrev }}" aria-label="Previous" style="{{ prevStyle }}" style-hover="opacity:0.6">‹</button>
    <img src="{{ lightboxWork.img }}" alt="{{ lightboxWork.title }}" style="max-width:78vw;max-height:74vh;object-fit:contain">
    <button onClick="{{ showNext }}" aria-label="Next" style="{{ nextStyle }}" style-hover="opacity:0.6">›</button>
    <div style="position:absolute;bottom:6vh;left:0;right:0;text-align:center">
      <div style="font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:#FFFFFF">{{ lightboxWork.title }}</div>
    </div>
  </div>
</sc-if>
</x-dc>

  { title: "The Burrow II", category: "landscape", img: "uploads/burrow.JPG" },
  { title: "Just the One", category: "other", img: "uploads/Just the one.png" },
  { title: "The Queen's", category: "landscape", img: "uploads/queens.JPG" },
  { title: "Howth House I", category: "landscape", img: "uploads/howth-house.JPG" },
  { title: "The Boat", category: "other", img: "uploads/boat.JPG" },
  { title: "Howth House II", category: "landscape", img: "uploads/howth-house2.JPG" },
  { title: "The Burrow III", category: "landscape", img: "uploads/burrow2.JPG" },
  { title: "Poolbeg Chimneys", category: "landscape", img: "uploads/poolbeg.JPG", zoom: 1.24 },
  { title: "Balscadden Bay II", category: "landscape", img: "uploads/balslcadden2.JPG" },
  { title: "Spaniel Study II", category: "pets", img: "uploads/spaniel2.JPG" },
  { title: "Robin", category: "nature", img: "uploads/robin.JPG" }
];
const FILTERS = [
  { key: 'all', label: 'All' },
  { key: 'landscape', label: 'Landscapes' },
  { key: 'portrait', label: 'Life Drawing & Portraits' },
  { key: 'pets', label: 'Pets' },
  { key: 'nature', label: 'Nature' },
  { key: 'other', label: 'Other' }
];
const PAGE = 15;

class Component extends DCLogic {
  state = { filter: 'all', lightboxWork: null, page: 0 };
  visibleWorks() {
    return WORKS.filter(w => this.state.filter === 'all' || w.category === this.state.filter);
  }
  step(dir) {
    const v = this.visibleWorks();
    const st = this.state.page * PAGE;
    const list = v.slice(st, st + PAGE);
    const i = list.findIndex(w => w.img === (this.state.lightboxWork || {}).img);
    if (i === -1) return;
    this.setState({ lightboxWork: list[(i + dir + list.length) % list.length] });
  }
  componentDidMount() {
    this._key = (e) => {
      if (!this.state.lightboxWork) return;
      if (e.key === 'ArrowRight') this.step(1);
      else if (e.key === 'ArrowLeft') this.step(-1);
      else if (e.key === 'Escape') this.setState({ lightboxWork: null });
    };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._key); }
  renderVals() {
    const base = { background: 'none', border: '1px solid rgba(255,255,255,0.35)', borderRadius: '0', padding: '10px 20px', fontFamily: "'Jost', sans-serif", fontSize: '0.7rem', letterSpacing: '0.18em', textTransform: 'uppercase', cursor: 'pointer', color: 'rgba(255,255,255,0.8)' };
    const on = { background: '#FFFFFF', color: '#0E4A47', border: '1px solid #FFFFFF' };
    const visible = this.visibleWorks();
    const pages = Math.max(1, Math.ceil(visible.length / PAGE));
    const page = Math.min(this.state.page, pages - 1);
    const start = page * PAGE;
    const slice = visible.slice(start, start + PAGE);
    const shownSet = new Set(slice.map(w => w.img));
    return {
      filters: FILTERS.map(f => ({
        label: f.label,
        style: this.state.filter === f.key ? { ...base, ...on } : base,
        onClick: () => this.setState({ filter: f.key, page: 0 })
      })),
      works: WORKS.map(w => {
        const zoom = w.zoom || 1;
        return {
          ...w,
          wrapStyle: { cursor: 'pointer', display: shownSet.has(w.img) ? 'block' : 'none' },
          imgStyle: { width: '100%', height: '100%', objectFit: 'cover', display: 'block', transition: 'transform .8s ease', transform: 'scale(' + zoom + ')' },
          onClick: () => this.setState({ lightboxWork: w })
        };
      }),
      countLabel: (start + 1) + '–' + (start + slice.length) + ' of ' + visible.length,
      hasPrevPage: page > 0,
      hasNextPage: page < pages - 1,
      prevPage: () => this.setState({ page: page - 1 }),
      nextPage: () => this.setState({ page: page + 1 }),
      pageBtnStyle: { fontFamily: "'Jost',sans-serif", fontSize: '0.72rem', letterSpacing: '0.22em', textTransform: 'uppercase', color: '#FFFFFF', border: '1px solid rgba(255,255,255,0.5)', background: 'none', padding: '14px 30px', cursor: 'pointer' },
      lightboxOpen: !!this.state.lightboxWork,
      lightboxWork: this.state.lightboxWork || {},
      prevStyle: { position: 'absolute', left: '2vw', top: '50%', transform: 'translateY(-50%)', background: 'none', border: 'none', cursor: 'pointer', color: '#FFFFFF', fontSize: '2.6rem', lineHeight: 1, padding: '10px 18px' },
      nextStyle: { position: 'absolute', right: '2vw', top: '50%', transform: 'translateY(-50%)', background: 'none', border: 'none', cursor: 'pointer', color: '#FFFFFF', fontSize: '2.6rem', lineHeight: 1, padding: '10px 18px' },
      onTouchStart: (e) => { this._x = e.touches[0].clientX; },
      onTouchEnd: (e) => {
        if (this._x == null) return;
        const dx = e.changedTouches[0].clientX - this._x;
        this._x = null;
        if (Math.abs(dx) > 40) this.step(dx < 0 ? 1 : -1);
      },
      showPrev: (e) => { e.stopPropagation(); this.step(-1); },
      showNext: (e) => { e.stopPropagation(); this.step(1); },
      closeLightbox: () => this.setState({ lightboxWork: null }),
      closeLightboxBg: (e) => { if (e.target === e.currentTarget) this.setState({ lightboxWork: null }); }
    };
  }
}
</script>
</body>
</html>
