<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#0E4A47;color:#FFFFFF;font-family:'Jost',sans-serif;overflow-x:hidden}
  a{text-decoration:none;color:#FFFFFF}
  a:hover{color:rgba(255,255,255,0.7)}
  ::selection{background:#FFFFFF;color:#0E4A47}
  .piece-item{grid-column:span 3}
  @media (max-width:1000px){.piece-item{grid-column:span 4 !important}}
  @media (max-width:760px){.piece-item{grid-column:span 6 !important}}
</style>
</helmet>
<dc-import name="Nav" current="gallery" hint-size="100%,150px"></dc-import>

<section style="padding:58px 5vw 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px">
  <span style="font-family:'Jost',sans-serif;font-size:0.7rem;letter-spacing:0.24em;text-transform:uppercase;color:rgba(255,255,255,0.6)">Selected Works</span>
  <h1 style="font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2rem,4.6vw,3.2rem);letter-spacing:0.06em;margin:0">Gallery</h1>
  <p style="font-family:'Jost',sans-serif;font-weight:300;max-width:62ch;font-size:1rem;line-height:1.8;margin:0;color:rgba(255,255,255,0.8)">These are some of the paintings I have created over the years. If you're interested in a particular painting, please get in touch or see <a href="Commissions.dc.html" style="border-bottom:1px solid rgba(255,255,255,0.5)"><b>Commissions</b></a> for a piece made just for you.</p>
</section>

<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:14px 5vw 34px">
  <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
    <button onClick="{{ f.onClick }}" style="{{ f.style }}">{{ f.label }}</button>
  </sc-for>
</div>

<div style="padding:0 5vw 66px;display:grid;grid-template-columns:repeat(12,1fr);gap:34px">
  <sc-for list="{{ works }}" as="w" hint-placeholder-count="8">
    <div class="piece-item" style="{{ w.wrapStyle }}" onClick="{{ w.onClick }}">
      <div style="aspect-ratio:4/5;overflow:hidden;background:#0A3A38">
        <img src="{{ w.img }}" alt="{{ w.title }}" style="{{ w.imgStyle }}" style-hover="transform:scale(1.18)" loading="lazy">
      </div>
      <div style="margin-top:14px;text-align:center">
        <span style="font-family:'Cormorant Garamond',serif;font-size:1.1rem">{{ w.title }}</span>
      </div>
    </div>
  </sc-for>
</div>

<dc-import name="Quote" quote="When our little dog passed away at almost 19 years, we were devastated. While we had tons of photos we wanted something special to remember him by. We commissioned Susan to do a portrait of him from a photo and we were so happy at how well she captured his expression that we subsequently asked her to do portraits of our current two dogs. We are delighted with our 3 gorgeous portraits." attribution="Caroline" hint-size="100%,360px"></dc-import>

<dc-import name="Footer" hint-size="100%,420px"></dc-import>

<sc-if value="{{ lightboxOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;background:rgba(10,58,56,0.96);display:flex;align-items:center;justify-content:center;z-index:200;padding:5vw" onClick="{{ closeLightboxBg }}">
    <button onClick="{{ closeLightbox }}" style="position:absolute;top:30px;right:5vw;color:#FFFFFF;font-family:'Jost',sans-serif;font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;background:none;border:none;cursor:pointer">Close ✕</button>
    <img src="{{ lightboxWork.img }}" alt="{{ lightboxWork.title }}" style="max-width:88vw;max-height:74vh;object-fit:contain">
    <div style="position:absolute;bottom:6vh;left:0;right:0;text-align:center">
      <div style="font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:#FFFFFF">{{ lightboxWork.title }}</div>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
const WORKS = [
  { title: "Kenya", category: "other", img: "uploads/kenya.JPG" },
  { title: "Eyeries", category: "landscape", img: "uploads/eyeries.JPG" },
  { title: "Poolbeg", category: "landscape", img: "uploads/poolbeg2.JPG" },
  { title: "Samuel Beckett Bridge", category: "landscape", img: "uploads/beckett.JPG" },
  { title: "Crab", category: "other", img: "uploads/crab.JPG" },
  { title: "The Armchair", category: "other", img: "uploads/chair.JPG" },
  { title: "The Getaway", category: "other", img: "uploads/wedding2.JPG" },
  { title: "The Golfer", category: "other", img: "uploads/golfer.JPG" },
  { title: "Lahinch", category: "landscape", img: "uploads/lahinch.JPG" },
  { title: "The Bog", category: "landscape", img: "uploads/bog.JPG" },
  { title: "Clontarf", category: "landscape", img: "uploads/clontarf.JPG" },
  { title: "Howth Lighthouse", category: "landscape", img: "uploads/lighthouse.JPG" },
  { title: "The Burrow, Sutton\n", category: "landscape", img: "uploads/burrow3.JPG" },
  { title: "Balscadden Bay\n", category: "landscape", img: "uploads/balslcadden2.JPG" },
  { title: "Boys on the Beach", category: "portrait", img: "uploads/boys-beach.JPG" },
  { title: "The Yacht Club", category: "landscape", img: "uploads/yaught-club.JPG" },
  { title: "Howth Harbour", category: "landscape", img: "uploads/howth-harbour.JPG" },
  { title: "Dungarvan", category: "landscape", img: "uploads/dungarvan.JPG" },
  { title: "Straffan Workhouse", category: "other", img: "uploads/straffan.JPG" },
  { title: "Poolbeg Chimneys", category: "landscape", img: "uploads/poolbeg.JPG", zoom: 1.4 },
  { title: "Cat Study", category: "pets", img: "uploads/cat.JPG" },
  { title: "Golden Retriever", category: "pets", img: "uploads/retriever.JPG" },
  { title: "Caherdaniel", category: "landscape", img: "uploads/caherdaniel.JPG" },
  { title: "Kasey", category: "pets", img: "uploads/daschund.JPG" },
  { title: "The Boat", category: "other", img: "uploads/boat.JPG" },
  { title: "Kasey", category: "pets", img: "uploads/spaniel.JPG", zoom: 1.14 },
  { title: "Balscadden Bay", category: "landscape", img: "uploads/balscadden.JPG" },
  { title: "Meadowe", category: "pets", img: "uploads/retriever2.JPG" },
  { title: "The Fisherman", category: "portrait", img: "uploads/fisherman.JPG" },
  { title: "By the Lighthouse", category: "portrait", img: "uploads/lighthouse-couple.JPG" },
  { title: "Wedding Day", category: "portrait", img: "uploads/wedding.JPG" },
  { title: "Spaniel Study II", category: "pets", img: "uploads/spaniel2.JPG" },
  { title: "Irelands Eye", category: "landscape", img: "uploads/burrow.JPG" },
  { title: "Howth", category: "landscape", img: "uploads/howth-house2.JPG" },
  { title: "Butterfly", category: "other", img: "uploads/butterfly.JPG" },
  { title: "The Queen's", category: "landscape", img: "uploads/queens.JPG" },
  { title: "View to the Eye", category: "landscape", img: "uploads/burrow2.JPG" },
  { title: "Howth", category: "landscape", img: "uploads/howth-house.JPG" },
  { title: "Robin", category: "other", img: "uploads/robin.JPG" }
];
const FILTERS = [
  { key: 'all', label: 'All' },
  { key: 'landscape', label: 'Landscapes' },
  { key: 'portrait', label: 'Life Drawing & Portraits' },
  { key: 'pets', label: 'Pets' },
  { key: 'other', label: 'Other' }
];

class Component extends DCLogic {
  state = { filter: 'all', lightboxWork: null };
  renderVals() {
    const base = { background: 'none', border: '1px solid rgba(255,255,255,0.35)', borderRadius: '0', padding: '10px 20px', fontFamily: "'Jost', sans-serif", fontSize: '0.7rem', letterSpacing: '0.18em', textTransform: 'uppercase', cursor: 'pointer', color: 'rgba(255,255,255,0.8)' };
    const on = { background: '#FFFFFF', color: '#0E4A47', border: '1px solid #FFFFFF' };
    return {
      filters: FILTERS.map(f => ({
        label: f.label,
        style: this.state.filter === f.key ? { ...base, ...on } : base,
        onClick: () => this.setState({ filter: f.key })
      })),
      works: WORKS.map(w => {
        const visible = this.state.filter === 'all' || w.category === this.state.filter;
        const zoom = w.zoom || 1;
        return {
          ...w,
          wrapStyle: { cursor: 'pointer', display: visible ? 'block' : 'none' },
          imgStyle: { width: '100%', height: '100%', objectFit: 'cover', display: 'block', transition: 'transform .8s ease', transform: 'scale(' + zoom + ')' },
          onClick: () => this.setState({ lightboxWork: w })
        };
      }),
      lightboxOpen: !!this.state.lightboxWork,
      lightboxWork: this.state.lightboxWork || {},
      closeLightbox: () => this.setState({ lightboxWork: null }),
      closeLightboxBg: (e) => { if (e.target === e.currentTarget) this.setState({ lightboxWork: null }); }
    };
  }
}
</script>
</body>
</html>
